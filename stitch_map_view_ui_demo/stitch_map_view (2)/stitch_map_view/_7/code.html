<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=390, height=884, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            word-break: keep-all;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#a1cddd",
                        "primary-fixed-dim": "#4cd6fb",
                        "primary": "#00677d",
                        "inverse-on-surface": "#ecf2f4",
                        "secondary-container": "#bae7f7",
                        "outline": "#6d797e",
                        "inverse-surface": "#2b3134",
                        "surface-bright": "#f5fafd",
                        "tertiary-container": "#eb8f3b",
                        "surface-container": "#e9eff1",
                        "tertiary-fixed": "#ffdcc3",
                        "on-tertiary-container": "#5d2f00",
                        "on-primary-fixed-variant": "#004e5f",
                        "inverse-primary": "#4cd6fb",
                        "surface": "#f5fafd",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb77d",
                        "surface-container-low": "#eff4f7",
                        "primary-fixed": "#b3ebff",
                        "on-secondary-container": "#3d6977",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#00677d",
                        "outline-variant": "#bcc9ce",
                        "surface-container-highest": "#dee3e6",
                        "surface-variant": "#dee3e6",
                        "on-surface": "#171c1f",
                        "on-tertiary-fixed": "#2f1500",
                        "surface-container-high": "#e3e9ec",
                        "on-secondary-fixed-variant": "#1e4c5a",
                        "secondary-fixed": "#bdeafa",
                        "background": "#f5fafd",
                        "surface-dim": "#d5dbde",
                        "on-surface-variant": "#3d494d",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#001f27",
                        "on-primary-fixed": "#001f27",
                        "on-background": "#171c1f",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#00414f",
                        "primary-container": "#00b4d8",
                        "secondary": "#396472",
                        "on-tertiary-fixed-variant": "#6e3900",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "tertiary": "#914d00",
                        "error": "#ba1a1a"
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface w-[390px] h-[884px] mx-auto overflow-hidden flex flex-col relative">
<!-- TopAppBar -->
<header class="bg-[#f5fafd]/80 dark:bg-[#171c1f]/80 backdrop-blur-xl sticky top-0 z-50 flex flex-col w-full px-6 pt-4">
<div class="flex justify-between items-center mb-6">
<h1 class="text-2xl font-bold text-[#171c1f] dark:text-[#f5fafd] tracking-tight">CleanAir</h1>
<div class="flex gap-4">
<span class="material-symbols-outlined text-[#00677d] dark:text-[#00b4d8] scale-95 active:opacity-80 transition-transform">search</span>
<span class="material-symbols-outlined text-[#00677d] dark:text-[#00b4d8] scale-95 active:opacity-80 transition-transform">cloud</span>
</div>
</div>
<!-- Tabs -->
<nav class="flex justify-between items-center w-full">
<a class="text-[#396472] dark:text-[#bcc9ce] font-medium pb-2 transition-colors duration-300 hover:text-[#00b4d8]" href="#">개요</a>
<a class="text-[#396472] dark:text-[#bcc9ce] font-medium pb-2 transition-colors duration-300 hover:text-[#00b4d8]" href="#">모니터링</a>
<a class="text-[#396472] dark:text-[#bcc9ce] font-medium pb-2 transition-colors duration-300 hover:text-[#00b4d8]" href="#">건강</a>
<a class="text-[#00677d] dark:text-[#00b4d8] border-b-2 border-[#00677d] dark:border-[#00b4d8] font-semibold pb-2 transition-colors duration-300" href="#">비교</a>
</nav>
</header>
<!-- Main Content: Empty State -->
<main class="flex-1 flex flex-col items-center justify-center px-8 text-center bg-surface relative">
<!-- Editorial Decorative Background Element -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-64 h-64 bg-primary-fixed opacity-20 blur-[80px] rounded-full -z-10"></div>
<!-- Asymmetrical Editorial Float Layout -->
<div class="mb-12 flex flex-col items-center">
<div class="relative mb-8">
<div class="w-32 h-32 bg-surface-container-low rounded-[2.5rem] flex items-center justify-center transform -rotate-6 shadow-sm">
<span class="material-symbols-outlined text-outline-variant text-6xl transform rotate-6" style="font-variation-settings: 'wght' 200;">cloud_off</span>
</div>
<div class="absolute -bottom-2 -right-2 w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-error text-2xl">priority_high</span>
</div>
</div>
<h2 class="text-2xl font-bold text-on-surface mb-4 leading-tight tracking-tight">측정 데이터가 없습니다</h2>
<p class="text-[#396472] leading-relaxed mb-10 text-sm px-2">
                센서가 연결되어 있지 않거나, 실시간 데이터를 수신하지 못하고 있습니다. 센서 연결 상태를 확인해 주세요.
            </p>
<button class="bg-gradient-to-br from-primary to-primary-container text-white px-8 py-4 rounded-full font-semibold shadow-lg shadow-primary/20 flex items-center gap-2 transform active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">settings_input_component</span>
                센서 설정으로 이동
            </button>
</div>
<!-- Suggestion Card (Editorial Detail) -->
<div class="w-full bg-surface-container-lowest p-6 rounded-2xl text-left border border-outline-variant/10">
<p class="text-[11px] font-bold text-secondary tracking-widest uppercase mb-3">도움말</p>
<div class="flex items-start gap-4">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary text-[20px]">info</span>
</div>
<div>
<p class="text-sm font-semibold text-on-surface mb-1">센서 오프라인 안내</p>
<p class="text-xs text-on-surface-variant leading-normal">와이파이 연결 상태를 확인하거나 전원 케이블이 올바르게 연결되었는지 확인해 보세요.</p>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<footer class="bg-[#ffffff]/80 dark:bg-[#171c1f]/80 backdrop-blur-xl fixed bottom-0 left-0 w-full z-50 rounded-t-[2rem] flex justify-around items-center px-4 pb-8 pt-4 shadow-[0_-8px_32px_rgba(23,28,31,0.04)]">
<div class="flex flex-col items-center justify-center text-[#396472] dark:text-[#bcc9ce] px-5 py-2 hover:scale-110 transition-transform duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-['Pretendard'] text-[11px] font-bold tracking-wider mt-1">Dashboard</span>
</div>
<div class="flex flex-col items-center justify-center text-[#396472] dark:text-[#bcc9ce] px-5 py-2 hover:scale-110 transition-transform duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span class="font-['Pretendard'] text-[11px] font-bold tracking-wider mt-1">Analysis</span>
</div>
<div class="flex flex-col items-center justify-center text-[#396472] dark:text-[#bcc9ce] px-5 py-2 hover:scale-110 transition-transform duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="health_and_safety">health_and_safety</span>
<span class="font-['Pretendard'] text-[11px] font-bold tracking-wider mt-1">Health</span>
</div>
<div class="flex flex-col items-center justify-center text-[#00677d] dark:text-[#00b4d8] bg-[#eff4f7] dark:bg-[#e3e9ec]/10 rounded-full px-5 py-2 hover:scale-110 transition-transform duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Pretendard'] text-[11px] font-bold tracking-wider mt-1">Settings</span>
</div>
</footer>
</body></html>
