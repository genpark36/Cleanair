<style>
        body { font-family: 'Pretendard', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .loader-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            border: 4px solid rgba(0, 180, 216, 0.1);
            box-sizing: border-box;
        }
        .loader-ring::after {
            content: '';  
            box-sizing: border-box;
            position: absolute;
            left: 0;
            top: 0;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border-left: 4px solid #00b4d8;
            border-bottom: 4px solid transparent;
            animation: rotation 2s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface w-[390px] h-[884px] mx-auto overflow-hidden flex flex-col relative">
<!-- TopAppBar -->
<header class="bg-[#f5fafd]/80 backdrop-blur-xl docked full-width top-0 sticky z-50">
<div class="flex flex-col w-full max-w-screen-xl mx-auto px-6 pt-4">
<div class="flex items-center justify-between h-14">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#00677d]" data-icon="cloud">cloud</span>
<h1 class="text-2xl font-bold text-[#171c1f]">CleanAir</h1>
</div>
<button class="scale-95 active:opacity-80 transition-transform">
<span class="material-symbols-outlined text-[#396472]" data-icon="search">search</span>
</button>
</div>
<!-- Custom TabBar -->
<nav class="flex items-center justify-between mt-2 px-1">
<a class="text-[#396472] font-medium py-3 hover:text-[#00b4d8] transition-colors duration-300" href="#">개요</a>
<a class="text-[#396472] font-medium py-3 hover:text-[#00b4d8] transition-colors duration-300" href="#">모니터링</a>
<a class="text-[#396472] font-medium py-3 hover:text-[#00b4d8] transition-colors duration-300" href="#">건강</a>
<a class="text-[#00677d] border-b-2 border-[#00677d] font-semibold py-3" href="#">비교</a>
</nav>
</div>
</header>
<!-- Main Content: Loading Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-8 text-center bg-surface relative">
<!-- Editorial Background Element -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-primary-fixed opacity-20 blur-[100px] rounded-full -z-10"></div>
<!-- Loading Visual -->
<div class="relative mb-12">
<div class="loader-ring"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
<span class="material-symbols-outlined text-primary-container text-4xl animate-pulse" data-icon="aq">aq</span>
</div>
</div>
<!-- Textual Feedback -->
<div class="space-y-4">
<h2 class="text-2xl font-bold text-on-surface tracking-tight">
                외부 데이터 불러오는 중
            </h2>
<p class="text-secondary body-lg leading-relaxed max-w-[280px] mx-auto">
                AQICN(PM2.5), 기상청(온도/습도) 데이터를 조회하고 있습니다. 잠시만 기다려주세요.
            </p>
</div>
<!-- Editorial Float Decoration -->
<div class="mt-16 w-full max-w-[320px]">
<div class="bg-surface-container-low rounded-xl p-6 flex items-center gap-4 text-left">
<div class="w-12 h-12 rounded-full overflow-hidden bg-surface-container-high flex-shrink-0">

</div>
<div class="flex-grow">
<p class="text-xs font-bold text-secondary-fixed-variant uppercase tracking-widest mb-1">TIP</p>
<p class="text-sm text-on-surface-variant leading-snug">비교 탭에서는 전국의 대기질 상태를 한눈에 볼 수 있습니다.</p>
</div>
</div>
</div>

<nav class="fixed bottom-0 w-full z-50 rounded-t-[2rem] bg-[#ffffff]/80 backdrop-blur-xl shadow-[0_-8px_32px_rgba(23,28,31,0.04)]">

<!-- Dashboard (Active because of Analysis/Dashboard context in shell) -->
<button class="flex flex-col items-center justify-center text-[#396472] px-5 py-2 hover:scale-110 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-['Pretendard'] text-[11px] font-bold tracking-wider mt-1">Dashboard</span>
</button>
<!-- Analysis -->

<span class="font-['Pretendard'] text-[11px] font-bold tracking-wider mt-1">Health</span>
</button>

<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Pretendard'] text-[11px] font-bold tracking-wider mt-1">Settings</span>
</button>
</div>
