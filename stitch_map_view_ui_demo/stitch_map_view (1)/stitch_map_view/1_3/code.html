<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>CleanAir - Location Permission</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
<style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00677d",
                        "primary-container": "#00b4d8",
                        "secondary": "#396472",
                        "surface": "#ffffff",
                        "on-surface": "#171c1f",
                    },
                    fontFamily: {
                        "sans": ["Pretendard", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-white text-on-surface h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="w-full flex justify-between items-center px-6 py-5">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#171c1f]" data-icon="close">close</span>
<span class="text-xl font-bold text-[#171c1f] tracking-tight font-black">CleanAir</span>
</div>
<div class="text-[#00677d] text-lg font-bold">
            1/3
        </div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center px-8 text-center">
<!-- Map Illustration -->
<div class="relative w-32 h-32 mb-10 flex items-center justify-center">
<div class="absolute inset-0 bg-[#f5fafd] rounded-full scale-110"></div>
<div class="relative z-10 w-full h-full flex items-center justify-center"><span class="material-symbols-outlined text-[#00677d] text-7xl" style="font-variation-settings: 'FILL' 1;">location_on</span></div>
</div>
<div class="space-y-3">
<h1 class="text-3xl font-bold text-on-surface leading-tight tracking-tight mb-4">
                깨끗한 공기의 시작,<br/>당신의 위치에서
            </h1>
</div>
</main>
<!-- Bottom Actions -->
<nav class="w-full px-6 pb-12 flex flex-col gap-3 max-w-md mx-auto">
<!-- Primary Action -->
<button class="w-full py-4 bg-gradient-to-r from-[#008ba3] to-[#00b4d8] text-white rounded-full flex items-center justify-center shadow-lg font-semibold text-lg active:scale-[0.98] transition-transform">
            위치 권한 허용
        </button>
<!-- Secondary Action -->
<button class="w-full py-3 text-secondary font-medium text-base active:opacity-60 transition-opacity">
            나중에 하기
        </button>
</nav>
<!-- Subtle Background elements removed for "Clean White Background" -->
</body></html>
