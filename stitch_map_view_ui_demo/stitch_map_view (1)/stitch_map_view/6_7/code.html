<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=390, height=884, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-error-container": "#93000a",
              "on-secondary-container": "#3d6977",
              "surface-container-highest": "#dee3e6",
              "on-secondary-fixed-variant": "#1e4c5a",
              "tertiary": "#914d00",
              "surface-container-lowest": "#ffffff",
              "tertiary-container": "#eb8f3b",
              "on-tertiary-fixed-variant": "#6e3900",
              "tertiary-fixed-dim": "#ffb77d",
              "surface": "#f5fafd",
              "outline": "#6d797e",
              "on-secondary-fixed": "#001f27",
              "on-background": "#171c1f",
              "inverse-surface": "#2b3134",
              "secondary": "#396472",
              "secondary-fixed": "#bdeafa",
              "on-tertiary": "#ffffff",
              "inverse-on-surface": "#ecf2f4",
              "tertiary-fixed": "#ffdcc3",
              "on-surface": "#171c1f",
              "on-primary": "#ffffff",
              "surface-container": "#e9eff1",
              "outline-variant": "#bcc9ce",
              "on-surface-variant": "#3d494d",
              "on-tertiary-container": "#5d2f00",
              "surface-tint": "#00677d",
              "on-primary-container": "#00414f",
              "primary-fixed": "#b3ebff",
              "on-secondary": "#ffffff",
              "on-primary-fixed": "#001f27",
              "error": "#ba1a1a",
              "secondary-container": "#bae7f7",
              "primary-fixed-dim": "#4cd6fb",
              "surface-container-low": "#eff4f7",
              "on-primary-fixed-variant": "#004e5f",
              "background": "#f5fafd",
              "on-error": "#ffffff",
              "primary-container": "#00b4d8",
              "on-tertiary-fixed": "#2f1500",
              "secondary-fixed-dim": "#a1cddd",
              "surface-variant": "#dee3e6",
              "inverse-primary": "#4cd6fb",
              "surface-container-high": "#e3e9ec",
              "error-container": "#ffdad6",
              "primary": "#00677d",
              "surface-bright": "#f5fafd",
              "surface-dim": "#d5dbde"
            },
            fontFamily: {
              "headline": ["Pretendard", "Inter", "sans-serif"],
              "body": ["Pretendard", "Inter", "sans-serif"],
              "label": ["Pretendard", "Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "1rem", "xl": "1.25rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body { font-family: 'Pretendard', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom pulsating effect without using standard animations as per instructions, using static layered approach for the "Lucid Editorial" feel */
        .search-aura {
            background: radial-gradient(circle, rgba(0, 180, 216, 0.15) 0%, rgba(245, 250, 253, 0) 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface w-[390px] h-[884px] overflow-hidden flex flex-col relative">
<!-- TopAppBar from Shared Components JSON -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-6 h-16 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shadow-sm dark:shadow-none">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-cyan-500 dark:text-cyan-400 cursor-pointer active:scale-95 duration-150" data-icon="arrow_back">arrow_back</span>
</div>
<h1 class="font-['Pretendard'] text-lg font-bold tracking-tight text-on-surface">Onboarding 1/7</h1>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col pt-24 px-8 pb-32">
<!-- Editorial Header Section -->
<section class="mb-12">
<h2 class="text-[2rem] font-bold leading-tight tracking-tight text-on-background mb-4">
                주변 센서 찾는 중
            </h2>
<p class="text-secondary text-base leading-relaxed break-keep">
                동일한 Wi-Fi 네트워크 내에서 센서를 자동으로 감지하고 있습니다. 최대 1분 정도 소요될 수 있습니다.
            </p>
</section>
<!-- Asymmetrical Visual Search Area -->
<section class="flex-1 flex items-center justify-center relative">
<!-- Pulsating Background Layers -->
<div class="absolute w-80 h-80 rounded-full search-aura"></div>
<div class="absolute w-60 h-60 rounded-full border border-primary-container/20"></div>
<!-- Center Focus Component: The "Editorial Float" Concept -->
<div class="relative z-10 w-48 h-48 bg-surface-container-lowest rounded-full shadow-[0_8px_32px_rgba(23,28,31,0.04)] flex items-center justify-center overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-primary-container/10"></div>
<!-- Center Device Icon -->
<div class="relative flex flex-col items-center">
<span class="material-symbols-outlined text-primary-container text-6xl mb-2" data-icon="air_purifier_gen">air_purifier_gen</span>
<div class="flex gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container/40"></span>
<span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
<span class="w-1.5 h-1.5 rounded-full bg-primary-container/40"></span>
</div>
</div>
</div>
<!-- Floating Status Indicator (Asymmetric) -->
<div class="absolute top-1/4 right-0 translate-x-4 bg-surface-container-lowest py-2 px-4 rounded-full shadow-sm flex items-center gap-2 border border-outline-variant/10">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span class="text-xs font-semibold text-secondary uppercase tracking-widest">Searching...</span>
</div>
</section>
<!-- Secondary Action (PIN Entry) -->
<section class="mt-auto flex justify-center pb-8">
<a class="text-primary font-medium text-sm underline underline-offset-4 hover:opacity-80 transition-opacity" href="#">
                PIN 번호로 직접 등록하기
            </a>
</section>
</main>
<!-- BottomNavBar from Shared Components JSON (Transformed for Step 6a) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex flex-row gap-4 justify-between items-center bg-transparent max-w-[390px] mx-auto pb-8 px-6">
<!-- Back Destination -->
<button class="flex-1 flex flex-row items-center justify-center gap-2 text-slate-600 dark:text-slate-400 font-medium py-4 px-8 hover:brightness-110 transition-all active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
<span class="font-['Pretendard'] text-sm font-semibold uppercase tracking-wider">Back</span>
</button>
<!-- Next Destination (Disabled State: "센서 감지 대기 중") -->
<button class="flex-1 flex flex-row items-center justify-center gap-2 bg-gradient-to-br from-slate-300 to-slate-400 text-white rounded-full py-4 px-8 shadow-lg shadow-slate-200 cursor-not-allowed opacity-80">
<span class="font-['Pretendard'] text-sm font-semibold tracking-wider">센서 감지 대기 중</span>
<span class="material-symbols-outlined animate-spin" data-icon="progress_activity" style="font-size: 18px;">progress_activity</span>
</button>
</nav>
<!-- Decorative Editorial Elements -->
<div class="absolute top-0 right-0 -z-10 w-1/2 h-1/2 bg-gradient-to-bl from-primary-fixed/30 to-transparent blur-3xl opacity-50"></div>
<div class="absolute bottom-0 left-0 -z-10 w-full h-1/3 bg-surface-container-low opacity-40"></div>
</body></html>
