<header class="bg-[#f5fafd]/80 dark:bg-[#171c1f]/80 backdrop-blur-xl flex items-center justify-between px-6 py-4 w-full docked full-width top-0 sticky z-50">
<div class="flex items-center gap-4">
<button class="tap-highlight-none active:scale-95 transition-transform text-[#396472] dark:text-[#bcc9ce] hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-['Pretendard'] font-semibold text-lg tracking-tight text-[#00677d] dark:text-[#00b4d8]">Step 6 of 6</h1>

</div>

      </p>

<div class="flex-1 flex flex-col">

</button>

<div class="w-24 h-24 bg-primary-fixed-dim/30 rounded-full blur-2xl absolute -right-4 -bottom-4"></div>

</div>
</div>
</div>

<span class="material-symbols-outlined ml-2" data-icon="arrow_forward">arrow_forward</span>

<div class="absolute top-1/4 -right-20 w-80 h-80 bg-primary-fixed-dim rounded-full blur-[120px]"></div>
