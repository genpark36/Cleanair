<style>
        body {
            font-family: 'Pretendard', sans-serif;
            width: 390px;
            height: 884px;
            margin: 0 auto;
            overflow: hidden;
            background-color: #ffffff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="text-on-background bg-white flex flex-col relative">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-6 h-16 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shadow-sm dark:shadow-none">
<div class="flex items-center">
<span class="material-symbols-outlined text-cyan-500 dark:text-cyan-400 cursor-pointer hover:opacity-80 transition-opacity active:scale-95 duration-150">arrow_back</span>
</div>
<h1 class="font-['Pretendard'] text-lg font-bold tracking-tight text-on-surface">Onboarding 7/7</h1>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-8 pt-16 pb-32">
<!-- Editorial Float Content Area -->
<div class="w-full flex flex-col items-center">
<!-- Success Illustration & Sensor Image -->
<div class="relative mb-12 w-full flex justify-center items-center">
<!-- Decorative Layered Circle -->
<div class="absolute w-64 h-64 bg-primary-fixed opacity-30 rounded-full blur-3xl"></div>
<div class="relative z-10 flex flex-col items-center">
<!-- Sensor Device Card (Glassmorphism) -->
<div class="w-48 h-48 bg-surface-container-lowest rounded-full shadow-2xl flex items-center justify-center p-4 relative">
<img alt="Modern air quality sensor device" class="w-32 h-32 object-contain rounded-xl" data-alt="Modern minimalist white cylindrical air quality sensor device on a clean white table with soft morning light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCARBsfDnvMTKhtjDVELEgxJapc_T6YJP_3QKEkShXCBSkQSel7Cg-WNeg1_EH-3xTjK8psnyEDAyGGfTp6zVxiM0l_hwJyEnyyaAlNblVPoXHeP__7QyytTpJJl_cGQeNGr-OfkLJAOR5KKBuETD4gUk0JHb0U0WHGKcMN-tq-QUPN7z8jmI7OSwXdxbkCzbxjjxyvEK7qE0CWDM33ZbN2eNjljNV6umP8PmzAihSrN_CaAI5ymB0QhudXVSlhrDqWz1BsqKt_yeY"/>
<!-- Success Checkmark Badge -->
<div class="absolute -bottom-2 -right-2 w-16 h-16 bg-gradient-to-br from-[#00677d] to-[#00B4D8] rounded-full flex items-center justify-center text-white border-4 border-white shadow-lg">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-4">
<h2 class="text-on-surface font-['Pretendard'] font-extrabold text-[2rem] leading-tight tracking-tight">
                    연결 완료
                </h2>
<p class="text-secondary font-['Pretendard'] text-[1.125rem] leading-relaxed break-keep font-medium">
                    센서가 성공적으로 연결되었습니다.<br/>이제 실시간 데이터를 확인할 수 있습니다.
                </p>
</div>
<!-- Feature Summary (Bento-lite Layout) -->
<div class="mt-12 w-full grid grid-cols-2 gap-4">
<div class="bg-surface-container-low p-4 rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">air</span>
<span class="text-sm font-semibold text-on-surface-variant">공기질 분석</span>
</div>
<div class="bg-surface-container-low p-4 rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
<span class="text-sm font-semibold text-on-surface-variant">실시간 알림</span>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Customized as Onboarding Finish) -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex flex-row gap-4 justify-between items-center bg-transparent max-w-[390px] mx-auto pb-8 px-6 h-auto">
<div class="w-full flex">
<!-- Active State Navigation Logic Applied to Primary CTA -->
<button class="w-full flex-1 flex flex-row items-center justify-center gap-2 bg-gradient-to-br from-[#00677d] to-[#00B4D8] text-white rounded-full py-4 px-8 shadow-lg shadow-cyan-500/20 font-['Pretendard'] text-sm font-semibold uppercase tracking-wider hover:brightness-110 hover:shadow-cyan-500/40 transition-all active:scale-[0.98]">
<span>홈으로 이동</span>
<span class="material-symbols-outlined text-white" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</footer>
