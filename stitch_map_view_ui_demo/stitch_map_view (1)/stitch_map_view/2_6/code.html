<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#f5fafd",
            "on-tertiary": "#ffffff",
            "secondary-fixed": "#bdeafa",
            "inverse-primary": "#4cd6fb",
            "tertiary-fixed": "#ffdcc3",
            "primary-fixed": "#b3ebff",
            "on-secondary-fixed-variant": "#1e4c5a",
            "surface-variant": "#dee3e6",
            "surface-container": "#e9eff1",
            "tertiary-fixed-dim": "#ffb77d",
            "surface-container-low": "#eff4f7",
            "on-primary": "#ffffff",
            "background": "#f5fafd",
            "outline": "#6d797e",
            "on-secondary-container": "#3d6977",
            "primary": "#00677d",
            "outline-variant": "#bcc9ce",
            "surface-bright": "#f5fafd",
            "secondary-container": "#bae7f7",
            "tertiary": "#914d00",
            "on-secondary": "#ffffff",
            "tertiary-container": "#eb8f3b",
            "surface-tint": "#00677d",
            "on-surface-variant": "#3d494d",
            "secondary-fixed-dim": "#a1cddd",
            "primary-container": "#00b4d8",
            "inverse-on-surface": "#ecf2f4",
            "on-surface": "#171c1f",
            "on-primary-fixed-variant": "#004e5f",
            "on-error-container": "#93000a",
            "on-secondary-fixed": "#001f27",
            "secondary": "#396472",
            "on-error": "#ffffff",
            "on-tertiary-fixed-variant": "#6e3900",
            "surface-container-highest": "#dee3e6",
            "on-tertiary-fixed": "#2f1500",
            "on-primary-container": "#00414f",
            "error-container": "#ffdad6",
            "error": "#ba1a1a",
            "surface-dim": "#d5dbde",
            "inverse-surface": "#2b3134",
            "on-primary-fixed": "#001f27",
            "surface-container-lowest": "#ffffff",
            "on-tertiary-container": "#5d2f00",
            "on-background": "#171c1f",
            "primary-fixed-dim": "#4cd6fb"
          },
          fontFamily: {
            "sans": ["Pretendard", "Inter", "system-ui", "sans-serif"],
            "headline": ["Pretendard", "Inter"],
            "body": ["Pretendard", "Inter"],
            "label": ["Pretendard", "Inter"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    body { font-family: 'Pretendard', sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface flex items-center justify-center min-h-screen">
<div class="w-[390px] h-[884px] bg-surface relative flex flex-col overflow-hidden select-none">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 h-16 bg-[#f5fafd] dark:bg-slate-950/80 backdrop-blur-xl">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#00B4D8]" data-icon="close">close</span>
</div>
<h1 class="font-['Pretendard'] font-semibold text-lg tracking-tight text-on-surface">센서 전원 켜기</h1>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-10 text-center pt-16 pb-32">
<!-- Progress Indicator -->
<div class="mb-12 flex flex-col items-center gap-3">
<span class="font-['Pretendard'] font-bold text-xs tracking-widest text-[#00677d] uppercase">Step 02 / 06</span>
<div class="flex gap-1.5 h-1 w-32 bg-surface-container rounded-full overflow-hidden">
<div class="h-full w-1/3 bg-gradient-to-r from-[#00677d] to-[#00B4D8] rounded-full"></div>
</div>
</div>
<!-- Icon Visualization (Editorial Asymmetry) -->
<div class="relative mb-16">
<div class="w-32 h-32 rounded-[2.5rem] bg-surface-container-lowest shadow-[0_8px_32px_rgba(23,28,31,0.04)] flex items-center justify-center relative z-10">
<span class="material-symbols-outlined text-7xl text-[#00B4D8]" data-icon="power_settings_new" data-weight="fill" style="font-variation-settings: 'FILL' 1;">power_settings_new</span>
</div>
<!-- Decorative Ambient Blurs (Design System depth) -->
<div class="absolute -top-4 -right-4 w-24 h-24 bg-primary-fixed opacity-40 blur-3xl rounded-full z-0"></div>
<div class="absolute -bottom-6 -left-6 w-20 h-20 bg-secondary-container opacity-30 blur-2xl rounded-full z-0"></div>
</div>
<!-- Editorial Typography -->
<h2 class="font-['Pretendard'] font-extrabold text-[2.25rem] leading-tight text-on-surface mb-6 tracking-tight">
        센서 전원 켜기
      </h2>
<p class="font-['Pretendard'] text-[1.0625rem] leading-relaxed text-secondary font-medium break-keep">
        전원을 켠 뒤 <span class="text-[#00677d] font-bold">10~20초</span> 기다리면 센서가 <span class="bg-surface-container-high px-1.5 py-0.5 rounded-md text-on-surface-variant font-mono text-sm">AirGradient-모델번호</span> 형태의 Wi-Fi 신호를 생성합니다.
      </p>
<!-- Status Card (Glassmorphism) -->
<div class="mt-12 w-full p-6 rounded-2xl bg-white/40 backdrop-blur-md border border-white/20 flex items-center gap-4 text-left">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[#00677d]" data-icon="settings_input_antenna">settings_input_antenna</span>
</div>
<div>
<p class="text-xs font-bold text-secondary tracking-wide uppercase">Signal Status</p>
<p class="text-sm font-semibold text-on-surface">대기 중: Wi-Fi 신호 검색 가능</p>
</div>
</div>
</main>
<!-- Bottom Action Shell -->
<div class="fixed bottom-0 w-full z-50 flex flex-col px-8 pb-12 pt-6 bg-[#f5fafd]/70 backdrop-blur-2xl">
<button class="w-full h-16 rounded-full bg-gradient-to-br from-[#00677d] to-[#00B4D8] text-white font-['Pretendard'] font-bold text-lg shadow-[0_8px_24px_rgba(0,180,216,0.25)] hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>전원을 켰어요</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Secondary Navigation -->
<div class="mt-6 flex justify-center">
<button class="text-secondary font-semibold text-sm py-2 px-4 hover:opacity-80 transition-opacity flex items-center gap-1">
<span class="material-symbols-outlined text-base" data-icon="help">help</span>
          전원이 켜지지 않나요?
        </button>
</div>
</div>
</div>
</body></html>
