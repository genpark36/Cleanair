<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CleanAir</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
<script id="tailwind-config">

                extend: {

                        "full": "0.75rem",

                },

<p class="text-on-surface-variant font-medium text-lg">
                CleanAir와 함께하세요
            </p>
</div>

<div class="w-full">
<button class="w-full bg-gradient-to-r from-[#008ba3] to-[#00b4d8] text-on-primary py-5 px-6 rounded-button font-bold text-xl shadow-lg shadow-primary/20 hover:opacity-95 active:scale-[0.98] transition-all duration-200">
                시작하기
            </button>
</div>
</main>
</body></html>
