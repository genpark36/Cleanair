<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Pretendard Font Import -->
<link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
<style>
        body { font-family: 'Pretendard', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .headline-lg { font-size: 1.75rem; line-height: 1.3; font-weight: 700; }
        .label-md { font-size: 0.75rem; line-height: 1.5; font-weight: 600; }
        .body-lg { font-size: 1rem; line-height: 1.6; }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#00B4D8",
                        "primary-container": "#00677d",
                        "on-primary": "#ffffff",
                        "background": "#f5fafd",
                        "surface": "#ffffff",
                        "on-surface": "#171c1f",
                        "on-surface-variant": "#3d494d",
                        "outline-variant": "#dee3e6",
                        "secondary": "#396472",
                        "surface-container": "#e9eff1",
                        "surface-container-low": "#eff4f7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    }
                },
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-[884px] h-screen flex flex-col items-center justify-center overflow-hidden">
<!-- Main Content Wrapper -->
<main class="w-[390px] h-full flex flex-col items-center justify-between py-16 px-6 relative z-10">
<!-- Top Section: Step Indicator & Success Icon -->
<div class="flex flex-col items-center gap-8 w-full">
<div class="label-md text-secondary tracking-widest px-4 py-1.5 bg-surface-container rounded-full uppercase">
                Step 04
            </div>
<div class="relative">
<!-- Background Glow -->
<div class="absolute inset-0 bg-primary/20 blur-3xl rounded-full scale-150"></div>
<!-- Success Checkmark -->
<div class="relative w-24 h-24 rounded-full bg-gradient-to-br from-primary to-primary-container flex items-center justify-center text-white shadow-xl shadow-primary/20">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Middle Section: Summary Card & Message -->
<div class="w-full flex flex-col items-center gap-8">
<!-- Registration Summary Card (No skew/offsets) -->
<div class="w-full bg-surface p-6 rounded-2xl shadow-sm border border-outline-variant/30">
<div class="flex justify-between items-start mb-6">
<div>
<p class="label-md text-secondary mb-1">거실 스마트 플러그</p>
<h3 class="text-xl font-bold text-on-surface">등록 완료</h3>
</div>
<div class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined">power</span>
</div>
</div>
<div class="space-y-3 mb-8">
<div class="h-2 w-3/4 bg-surface-container rounded-full"></div>
<div class="h-2 w-1/2 bg-surface-container-low rounded-full"></div>
</div>
<div class="flex items-center justify-between border-t border-outline-variant/20 pt-4">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<span class="label-md text-primary">현재 연결됨</span>
</div>
<div class="text-on-surface font-mono font-bold">0.0W</div>
</div>
</div>
<!-- Text Message -->
<div class="text-center space-y-3 px-4">
<h1 class="headline-lg text-on-surface">플러그가 성공적으로<br/>연결되었습니다!</h1>
<p class="body-lg text-on-surface-variant">
                    이제 대시보드에서 실시간 전력량 확인 및 자동 제어가 가능합니다.
                </p>
</div>
</div>
<!-- Bottom Section: Actions -->
<div class="flex flex-col w-full gap-4 px-2">
<button class="w-full h-[56px] bg-gradient-to-r from-primary-container to-primary text-on-primary rounded-full font-bold flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform">
                홈으로 이동
                <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<button class="w-full h-[48px] bg-transparent text-primary font-semibold hover:opacity-80 active:opacity-60 transition-opacity">
                장치 닉네임 설정하기
            </button>
</div>
</main>
<!-- Aesthetic Decorative Elements (Balanced & Symmetrical) -->
<div class="fixed top-0 left-1/2 -translate-x-1/2 w-full h-full pointer-events-none overflow-hidden">
<div class="absolute -top-[10%] left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute -bottom-[10%] left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-primary-container/5 rounded-full blur-3xl"></div>
</div>
</body></html>
