<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .headline-lg { font-size: 2rem; line-height: 1.2; font-weight: 700; }
        .label-md { font-size: 0.75rem; line-height: 1.5; font-weight: 700; }
        .body-lg { font-size: 1rem; line-height: 1.6; }
        
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(245, 250, 253, 0.8);
            backdrop-filter: blur(12px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#ffb77d",
                        "surface-dim": "#d5dbde",
                        "surface-container-low": "#eff4f7",
                        "background": "#f5fafd",
                        "tertiary-container": "#eb8f3b",
                        "primary-fixed-dim": "#4cd6fb",
                        "primary-fixed": "#b3ebff",
                        "tertiary-fixed": "#ffdcc3",
                        "surface-container": "#e9eff1",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#6e3900",
                        "on-background": "#171c1f",
                        "outline": "#6d797e",
                        "tertiary": "#914d00",
                        "surface-container-high": "#e3e9ec",
                        "inverse-primary": "#4cd6fb",
                        "on-tertiary-fixed": "#2f1500",
                        "surface-container-highest": "#dee3e6",
                        "on-surface-variant": "#3d494d",
                        "on-primary-fixed-variant": "#004e5f",
                        "on-error-container": "#93000a",
                        "outline-variant": "#bcc9ce",
                        "secondary-container": "#bae7f7",
                        "primary": "#00677d",
                        "on-primary-fixed": "#001f27",
                        "surface-variant": "#dee3e6",
                        "inverse-surface": "#2b3134",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-tint": "#00677d",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#00414f",
                        "secondary-fixed-dim": "#a1cddd",
                        "secondary-fixed": "#bdeafa",
                        "secondary": "#396472",
                        "on-tertiary-container": "#5d2f00",
                        "surface-bright": "#f5fafd",
                        "surface": "#f5fafd",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#1e4c5a",
                        "on-secondary-container": "#3d6977",
                        "on-surface": "#171c1f",
                        "on-secondary-fixed": "#001f27",
                        "inverse-on-surface": "#ecf2f4",
                        "error": "#ba1a1a",
                        "primary-container": "#00b4d8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "1rem",
                        "xl": "1.25rem",
                        "full": "9999px"
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center px-6 h-16 bg-[#f5fafd]/80 dark:bg-[#171c1f]/80 backdrop-blur-md">
<div class="flex items-center gap-4 w-full">
<button class="transition-opacity duration-200 active:opacity-70 text-[#00677d] dark:text-[#00b4d8]">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Pretendard'] headline-lg tracking-tight text-xl font-bold text-[#171c1f] dark:text-[#ffffff] flex-grow">신규 플러그 등록</h1>
<div class="text-[#396472] dark:text-[#bcc9ce] font-bold">3/4</div>
</div>
</header>
<!-- Main Content Area (Editorial Layout) -->
<main class="flex-grow pt-24 pb-32 px-6 max-w-2xl mx-auto w-full">
<!-- Editorial Header Section -->
<section class="mb-12">
<div class="inline-block px-3 py-1 bg-secondary-fixed text-on-secondary-fixed-variant rounded-full text-[10px] font-bold tracking-wider mb-6">
                STEP 03
            </div>
<h2 class="font-['Pretendard'] headline-lg tracking-tight mb-4 text-on-background leading-tight">
                집 Wi-Fi 정보 입력
            </h2>
<p class="body-lg text-on-surface-variant font-medium">
                플러그가 접속할 Wi-Fi 이름(SSID)과 비밀번호를 입력해 주세요.<br/>
<span class="text-primary font-semibold">(192.168.4.1 접속)</span>
</p>
</section>
<!-- Asymmetric Visual Element (Editorial Float) -->
<div class="relative mb-12 h-48 rounded-xl overflow-hidden shadow-sm">
<div class="absolute inset-0 bg-gradient-to-br from-primary-fixed to-secondary-fixed opacity-40"></div>
<img class="w-full h-full object-cover mix-blend-multiply opacity-80" data-alt="Modern smart home interior with soft daylight, minimal aesthetic, and high-tech internet router visible on a white shelf" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAtczdqbgkL4XkfQQNhN3lRT3RcCIdVlJNrVcrsFypKV2AuCGaw87HEcTTOIjfgscym2zYKm9YJ3WOBq-wea-ky6wh8IWW0eLJqJGhypIwjpSwYhYe6LJLIv202fma8x82y9WQs_MZDUdEMR5GP3HoFMgCurXvI-8gG-XaSVdqXDudrltRINerHjQZ6Ul4uTRw2azuNV_6lEE5fwJUxqyM_mzJHcAlRNfQnzwlwq0ACYAZtx9-VpfMZ9TZ6IoKP7Zxbv9C3qlNInLA"/>
<div class="absolute bottom-4 left-6 flex items-center gap-2 bg-surface-container-lowest/90 px-4 py-2 rounded-full shadow-lg">
<span class="material-symbols-outlined text-primary text-sm">wifi</span>
<span class="label-md text-on-surface">Wi-Fi 설정 필요</span>
</div>
</div>
<!-- Credential Form -->
<section class="space-y-8">
<!-- SSID Input Group -->
<div class="group">
<label class="label-md text-secondary block mb-2 px-1">와이파이 이름 (SSID)</label>
<div class="relative bg-surface-container-highest rounded-lg p-1 transition-all focus-within:bg-white focus-within:shadow-md">
<div class="flex items-center px-4 py-3">
<span class="material-symbols-outlined text-outline mr-3">signal_wifi_4_bar</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-outline-variant font-medium" placeholder="예: MyHome_WiFi_2G" type="text"/>
</div>
<div class="absolute bottom-0 left-0 h-[2px] w-0 bg-primary transition-all duration-300 group-focus-within:w-full"></div>
</div>
</div>
<!-- Password Input Group -->
<div class="group">
<label class="label-md text-secondary block mb-2 px-1">비밀번호</label>
<div class="relative bg-surface-container-highest rounded-lg p-1 transition-all focus-within:bg-white focus-within:shadow-md">
<div class="flex items-center px-4 py-3">
<span class="material-symbols-outlined text-outline mr-3">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-outline-variant font-medium" placeholder="와이파이 비밀번호" type="password"/>
<button class="text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="absolute bottom-0 left-0 h-[2px] w-0 bg-primary transition-all duration-300 group-focus-within:w-full"></div>
</div>
</div>
<!-- Information Card -->
<div class="bg-surface-container-low p-6 rounded-lg flex gap-4">
<span class="material-symbols-outlined text-primary-container">info</span>
<div>
<h4 class="label-md text-on-surface-variant mb-1">참고하세요</h4>
<p class="text-xs text-on-surface-variant/80 leading-relaxed">
                        클린에어 스마트 플러그는 2.4GHz Wi-Fi 대역을 권장합니다. 5GHz 대역은 일부 모델에서 연결이 원활하지 않을 수 있습니다.
                    </p>
</div>
</div>
</section>
</main>
<!-- Bottom Action Container -->
<footer class="fixed bottom-0 w-full px-6 pb-10 pt-4 bg-gradient-to-t from-background via-background to-transparent pointer-events-none">
<div class="max-w-2xl mx-auto w-full pointer-events-auto">
<button class="w-full h-14 bg-gradient-to-br from-[#00677d] to-[#00b4d8] text-white rounded-full font-bold text-lg shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2">
                저장 및 재부팅
                <span class="material-symbols-outlined">restart_alt</span>
</button>
</div>
</footer>
<!-- BottomNavBar (Suppressed as per task logic: Transactional flow) -->
<!-- We skip BottomNavBar here because the user is in a focused onboarding task. -->
</body></html>
