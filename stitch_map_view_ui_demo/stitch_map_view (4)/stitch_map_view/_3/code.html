    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface min-h-screen pt-20 pb-24 md:pb-0">
<!-- TopAppBar from JSON -->
<header class="fixed top-0 w-full z-50 bg-slate-50/80 dark:bg-slate-950/80 backdrop-blur-md shadow-none bg-opacity-70">
<div class="flex justify-between items-center px-6 py-4 max-w-full mx-auto">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-slate-200/50 transition-colors text-cyan-600">
<span class="material-symbols-outlined text-2xl" data-icon="location_on" data-weight="fill" style="font-variation-settings: 'FILL' 1;">location_on</span>
</button>
<h1 class="font-['Pretendard'] font-bold text-lg tracking-tight text-slate-900">상황 전파</h1>
<button class="flex items-center justify-center p-2 rounded-full hover:bg-slate-200/50 transition-colors text-cyan-600 relative">
<span class="material-symbols-outlined text-2xl" data-icon="notifications_active" data-weight="fill" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
<span class="absolute top-2 right-2 w-2.5 h-2.5 bg-error rounded-full"></span>
</button>
</div>
</header>
<main class="max-w-4xl mx-auto px-6 py-8 space-y-10">
<!-- Alert Summary Section -->
<section class="bg-error-container text-on-error-container rounded-lg p-6 relative overflow-hidden">
<div class="absolute -right-10 -top-10 opacity-10">
<span class="material-symbols-outlined text-9xl">warning</span>
</div>
<div class="relative z-10 flex flex-col gap-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-error text-3xl" style="font-variation-settings: 'FILL' 1;">error</span>
<h2 class="text-2xl font-bold text-error">화재 의심 패턴 감지</h2>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-2">
<div class="bg-surface-container-lowest/50 backdrop-blur-sm rounded-lg p-4">
<p class="text-sm font-semibold opacity-80 uppercase tracking-wider mb-1">발생 위치</p>
<p class="text-lg font-bold">새싹어린이집 1층</p>
</div>
<div class="bg-surface-container-lowest/50 backdrop-blur-sm rounded-lg p-4">
<p class="text-sm font-semibold opacity-80 uppercase tracking-wider mb-1">감지 시각</p>
<p class="text-lg font-bold">오후 14:32</p>
</div>
</div>
</div>
</section>
<!-- Contacts Section -->
<section>
<h3 class="text-xl font-bold mb-6 text-on-surface">책임자 연락처</h3>
<div class="space-y-4">
<!-- Facility Manager -->
<div class="bg-surface-container-lowest rounded-lg p-4 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-2xl">person</span>
</div>
<div>
<p class="text-sm font-bold text-secondary uppercase">시설 책임자</p>
<p class="text-base font-semibold text-on-surface">김책임</p>
</div>
</div>
<button class="bg-primary hover:opacity-90 text-on-primary rounded-full px-5 py-2 text-sm font-bold transition-opacity">
                        알림 전송
                    </button>
</div>
<!-- Assistant Manager -->
<div class="bg-surface-container-lowest rounded-lg p-4 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-secondary-container/20 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-2xl">support_agent</span>
</div>
<div>
<p class="text-sm font-bold text-secondary uppercase">보조 관리자</p>
<p class="text-base font-semibold text-on-surface">이보조</p>
</div>
</div>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-surface rounded-full px-5 py-2 text-sm font-bold transition-colors">
                        알림 전송
                    </button>
</div>
<!-- Guardian -->
<div class="bg-surface-container-lowest rounded-lg p-4 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-tertiary-container/20 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined text-2xl">family_restroom</span>
</div>
<div>
<p class="text-sm font-bold text-secondary uppercase">보호자 대표</p>
<p class="text-base font-semibold text-on-surface">박보호</p>
</div>
</div>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-surface rounded-full px-5 py-2 text-sm font-bold transition-colors">
                        알림 전송
                    </button>
</div>
</div>
</section>
<!-- Quick Actions -->
<section class="grid grid-cols-2 gap-4">
<button class="bg-error hover:bg-error/90 text-on-error rounded-lg p-6 flex flex-col items-center justify-center gap-3 transition-colors col-span-2 sm:col-span-1 shadow-sm">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">phone_in_talk</span>
<span class="font-bold text-lg">긴급전화 연결</span>
</button>
<button class="bg-surface-container-lowest hover:bg-surface-container-low text-on-surface rounded-lg p-6 flex flex-col items-center justify-center gap-3 transition-colors col-span-2 sm:col-span-1 border border-outline-variant/20 shadow-sm">
<span class="material-symbols-outlined text-3xl text-secondary">content_copy</span>
<span class="font-bold text-lg">신고 정보 복사</span>
</button>
</section>
<!-- Resolve Button -->
<section class="pt-6 border-t border-surface-container-highest">
<button class="w-full bg-surface-container-high hover:bg-surface-variant text-on-surface-variant font-bold rounded-lg py-4 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">task_alt</span>
                상황 종료 처리
            </button>
</section>

<nav class="fixed bottom-0 w-full z-50 rounded-t-[2rem] bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl shadow-[0_-8px_32px_rgba(23,28,31,0.04)] shadow-xl md:hidden">
<div class="flex justify-around items-center w-full px-4 pb-6 pt-3">
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-3 py-1.5 hover:text-cyan-500 transition-all" href="#">
<span class="material-symbols-outlined mb-1 text-2xl" data-icon="dashboard">dashboard</span>
<span class="font-['Pretendard'] font-semibold text-[10px] uppercase tracking-wider">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-3 py-1.5 hover:text-cyan-500 transition-all" href="#">

<span class="font-['Pretendard'] font-semibold text-[10px] uppercase tracking-wider">Analysis</span>

<span class="material-symbols-outlined mb-1 text-2xl" data-icon="warning" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-['Pretendard'] font-semibold text-[10px] uppercase tracking-wider">Alerts</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-3 py-1.5 hover:text-cyan-500 transition-all" href="#">
<span class="material-symbols-outlined mb-1 text-2xl" data-icon="settings_remote">settings_remote</span>
<span class="font-['Pretendard'] font-semibold text-[10px] uppercase tracking-wider">Devices</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-3 py-1.5 hover:text-cyan-500 transition-all" href="#">
<span class="material-symbols-outlined mb-1 text-2xl" data-icon="settings">settings</span>
<span class="font-['Pretendard'] font-semibold text-[10px] uppercase tracking-wider">Settings</span>
</a>
</div>
</nav>
