<style>
        body {
            font-family: 'Pretendard', 'Inter', sans-serif;
            background-color: #f5fafd;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);

            -webkit-backdrop-filter: blur(20px);

<body class="bg-background text-on-background h-screen overflow-hidden flex flex-col md:hidden w-[390px] mx-auto border-x border-surface-container-highest relative">
<!-- TopAppBar -->
<header class="docked full-width top-0 sticky z-50 bg-[#f5fafd]/80 dark:bg-slate-950/80 backdrop-blur-xl bg-[#eff4f7] dark:bg-slate-900 shadow-sm dark:shadow-none">
<div class="flex justify-between items-center w-full px-6 py-4">
<button class="text-[#00B4D8] hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Pretendard','Inter'] font-semibold text-lg tracking-tight text-[#171c1f] dark:text-white">위치 등록</h1>
<button class="text-[#00B4D8] hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined">help</span>
</button>
</div>
</header>
<!-- Map Area -->
<main class="flex-grow relative z-0 bg-surface-container-low h-full w-full overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A highly detailed, stylized digital map graphic with a clean, modern aesthetic. The map features subtle topographical lines and soft pastel colors primarily in light blues and muted teals, creating a serene and technical atmosphere. The lighting is bright and diffuse, typical of a high-end light-mode UI design. The mood is calm and informative, fitting for an environmental or safety monitoring application." data-location="Seoul" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCgqUfO78GKtR4wVR0buJzIGkUh5kj6XOKYifOK0z-GAzOi9farQqSF51DghnJcJngzZIFusBJB-8APNTNbl2LNPtiXCi-uLYTh0ZGsJi5yqCsfecw8q4H8teYUpngnnEduhHRZ9AlHmDet0SR5oMFK_jl54gQgGJYBEHLR02L6WDqwMbp8Ynq6tpTrNW8s5m9-QNfCd7Tjbf9x1QpEGEV_7a1AYQhFLTi5bmoi-L75ZSAXuPeXru5vu74yjh0va4mAoS4EdUFKW78');">

<div class="absolute inset-0 bg-surface-bright/40 mix-blend-overlay"></div>
<!-- Map Marker -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center z-10">
<div class="bg-surface-container-lowest text-primary font-bold px-3 py-1 rounded-full shadow-[0_4px_12px_rgba(23,28,31,0.08)] mb-2 text-sm flex items-center gap-1 border border-primary-fixed/30">
<span class="material-symbols-outlined text-[16px] text-primary">sensors</span>
                    Cleanair-01
                </div>
<div class="relative">
<div class="w-8 h-8 bg-primary rounded-full flex items-center justify-center shadow-[0_8px_16px_rgba(0,103,125,0.4)] z-20 relative">
<div class="w-3 h-3 bg-white rounded-full"></div>
</div>
<!-- Pulse effect -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-16 h-16 bg-primary/20 rounded-full z-10 animate-ping" style="animation-duration: 2s;"></div>
</div>
</div>
<!-- Map UI Controls -->
<div class="absolute right-4 top-24 flex flex-col gap-2 z-10">
<button class="w-10 h-10 bg-surface-container-lowest rounded-full shadow-[0_4px_12px_rgba(23,28,31,0.06)] flex items-center justify-center text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">my_location</span>
</button>
<button class="w-10 h-10 bg-surface-container-lowest rounded-full shadow-[0_4px_12px_rgba(23,28,31,0.06)] flex items-center justify-center text-secondary hover:text-primary transition-colors mt-4">
<span class="material-symbols-outlined text-[20px]">layers</span>
</button>
</div>
</div>
</main>
<!-- Floating Action Card -->
<div class="absolute bottom-0 left-0 w-full z-20 pb-8 px-4 pt-12 bg-gradient-to-t from-surface-bright via-surface-bright/90 to-transparent">
<div class="bg-surface-container-lowest rounded-[1.5rem] p-6 shadow-[0_-8px_32px_rgba(23,28,31,0.06)] border border-surface-container-highest/50">
<!-- Selected Location Info -->
<div class="mb-6">
<div class="text-xs font-semibold text-secondary mb-1 flex items-center gap-1 uppercase tracking-wider">
<span class="material-symbols-outlined text-[14px]">location_on</span>

                </div>
<h2 class="text-lg font-bold text-on-surface leading-tight">서울시 강남구 테헤란로 123</h2>
<p class="text-sm text-secondary mt-1">좌표: 37.5665° N, 126.9780° E</p>
</div>

<div class="flex flex-col gap-3">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-white font-bold py-4 rounded-xl shadow-[0_4px_12px_rgba(0,103,125,0.2)] active:scale-[0.98] transition-transform">
                    이 위치로 설정
                </button>
<button class="w-full bg-transparent text-primary font-semibold py-3 rounded-xl border border-primary/20 hover:bg-primary-fixed/20 active:scale-[0.98] transition-all">
                    다시 선택
                </button>
</div>
