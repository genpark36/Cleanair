<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-start w-full">
<!-- Mobile Container (390x884 simulation for preview) -->
<div class="w-full max-w-[390px] min-h-[884px] bg-surface relative overflow-hidden flex flex-col shadow-2xl mx-auto border border-surface-container-highest md:my-10 md:rounded-[2.5rem]">

<header class="bg-[#f5fafd]/80 backdrop-blur-xl font-['Pretendard','Inter'] font-semibold text-lg tracking-tight text-[#00B4D8] flex justify-between items-center w-full px-6 py-4 shadow-[0_8px_32px_rgba(23,28,31,0.04)] sticky top-0 z-50">
<button class="hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-2 -ml-2 text-on-surface">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-xl font-bold text-[#171c1f]">위치 등록</h1>
<button class="hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-2 -mr-2 text-on-surface">
<span class="material-symbols-outlined" data-icon="help">help</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-6 pt-8 pb-32 flex flex-col gap-10">
<!-- Search Section -->
<section class="flex flex-col gap-6">
<div>
<h2 class="text-[2rem] font-bold text-on-surface leading-tight tracking-tight mb-2">어디에 센서를<br/>설치하셨나요?</h2>
<p class="text-secondary text-sm">정확한 주소나 기관명을 검색해 주세요.</p>
</div>
<!-- Search Input Field (Editorial Style) -->
<div class="relative w-full group">
<div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
<span class="material-symbols-outlined text-primary">search</span>
</div>
<input class="w-full bg-surface-container-highest text-on-surface text-base rounded-full pl-12 pr-12 py-4 border-0 focus:ring-0 focus:outline-none focus:border-b-2 focus:border-primary transition-all shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)] font-medium" placeholder="주소 또는 기관명 검색" type="text" value="새싹어린이집"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-4">
<span class="material-symbols-outlined text-outline-variant hover:text-on-surface transition-colors">cancel</span>
</button>
</div>
</section>
<!-- Search Results Section -->
<section class="flex flex-col">
<div class="flex justify-between items-center mb-6">
<h3 class="text-sm font-bold text-secondary uppercase tracking-wider">검색 결과</h3>
<span class="text-xs font-medium bg-surface-container-high text-on-surface-variant px-2 py-1 rounded-full">3건</span>
</div>
<!-- Results List (Editorial Cards) -->
<div class="flex flex-col gap-4">
<!-- Result Card 1 -->
<button class="w-full text-left bg-surface-container-lowest rounded-2xl p-6 shadow-[0_8px_24px_rgba(23,28,31,0.03)] hover:shadow-[0_12px_32px_rgba(23,28,31,0.06)] transition-all active:scale-[0.98] flex items-center justify-between group">
<div class="flex flex-col gap-1 pr-4">
<h4 class="text-lg font-bold text-on-surface">새싹어린이집 본관</h4>
<p class="text-sm text-secondary">서울시 강남구 테헤란로 123</p>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-primary">chevron_right</span>
</div>
</button>
<!-- Result Card 2 -->
<button class="w-full text-left bg-surface-container-lowest rounded-2xl p-6 shadow-[0_8px_24px_rgba(23,28,31,0.03)] hover:shadow-[0_12px_32px_rgba(23,28,31,0.06)] transition-all active:scale-[0.98] flex items-center justify-between group">
<div class="flex flex-col gap-1 pr-4">
<h4 class="text-lg font-bold text-on-surface">새싹어린이집 별관</h4>
<p class="text-sm text-secondary">서울시 강남구 테헤란로 125</p>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-primary">chevron_right</span>
</div>
</button>
<!-- Result Card 3 -->
<button class="w-full text-left bg-surface-container-lowest rounded-2xl p-6 shadow-[0_8px_24px_rgba(23,28,31,0.03)] hover:shadow-[0_12px_32px_rgba(23,28,31,0.06)] transition-all active:scale-[0.98] flex items-center justify-between group mt-2 opacity-80">
<div class="flex flex-col gap-1 pr-4">
<div class="flex items-center gap-2 mb-1">
<span class="text-[10px] font-bold bg-surface-container text-secondary px-2 py-0.5 rounded-sm uppercase">근처 검색</span>
</div>
<h4 class="text-lg font-bold text-on-surface">행복요양원</h4>
<p class="text-sm text-secondary">서울시 강남구 테헤란로 130</p>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-primary">chevron_right</span>
</div>
</button>
</div>

</div>
